name: ggs_werewolf
description: "GGS Werewolf - Red vs Blue Edition"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # HTTP & WebSocket
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # Utilities
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.2

  # Audio
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/animations/
    - assets/audio/bgm/
    - assets/audio/sfx/
    - assets/beranda.png
    - assets/malam.png
    - assets/siang.png
    - assets/login-bg.png
    - assets/game-bg-day.png
    - assets/game-bg-night.png
