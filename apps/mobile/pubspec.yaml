name: ggs_werewolf
description: "GGS Werewolf - Red vs Blue Edition"
publish_to: 'none'

# L-08 FIX: Versioning strategy comment.
# Bump version BEFORE every store build:
#   version: <major>.<minor>.<patch>+<build-number>
# CI should auto-increment build number using:
#   flutter build apk --build-number=$GITHUB_RUN_NUMBER
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # HTTP & WebSocket
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # Utilities
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5

  # Audio
  audioplayers: ^6.1.0

  # Image picker & crop (for user avatar upload)
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # Firebase Messaging (push notifications)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6

  # URL launcher (for Midtrans payment redirect)
  url_launcher: ^6.3.1

  # Crash reporting
  sentry_flutter: ^8.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../../logo.png"
  min_sdk_android: 24 # Optional but recommended
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/audio/bgm/
    - assets/audio/sfx/
    - assets/beranda.png
    - assets/malam.png
    - assets/siang.png
    - assets/login-bg.png
    - assets/game-bg-day.png
    - assets/game-bg-night.png
    - assets/logo.png
