# Prometheus configuration for GGS Werewolf
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ggs-backend'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: '/api/health'
    # Custom metrics endpoint (add /metrics when prom client integrated)

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
