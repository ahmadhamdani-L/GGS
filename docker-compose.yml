version: '3.8'

services:
  # ─── PostgreSQL Database ────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ggs_werewolf
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/go-server/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Redis (shared state for scaling) ───────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Go Backend Server ──────────────────────────────────
  backend:
    build:
      context: ./backend/go-server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5433/ggs_werewolf?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-32chars}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      AVATAR_UPLOAD_DIR: /app/uploads/avatars
      ADMIN_KEY: ${ADMIN_KEY:-}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      APP_ENV: production
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads

  # ─── Nginx (TLS termination + reverse proxy) ────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    profiles:
      - with-nginx

  # ─── Prometheus (monitoring) ────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    profiles:
      - with-monitoring

  # ─── Grafana (dashboards) ───────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    profiles:
      - with-monitoring

volumes:
  pgdata:
  redisdata:
  uploads:
  promdata:
  grafanadata:

