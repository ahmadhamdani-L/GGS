# nginx reverse proxy + SSL termination for GGS Werewolf backend.
# Place your TLS cert/key in ./nginx/certs/ as server.crt / server.key.
# For Let's Encrypt: use certbot and mount /etc/letsencrypt/live/... as certs volume.

events {
    worker_connections 1024;
}

http {
    # ── Security headers applied globally ──────────────────────────
    add_header X-Content-Type-Options   "nosniff"           always;
    add_header X-Frame-Options          "DENY"              always;
    add_header X-XSS-Protection         "1; mode=block"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── Rate limiting zones ─────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=100r/m;
    limit_req_zone $binary_remote_addr zone=ws:10m      rate=5r/m;

    # ── Redirect HTTP → HTTPS ──────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ───────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── WebSocket ─────────────────────────────────────────────
        location /ws {
            limit_req zone=ws burst=3 nodelay;

            proxy_pass         http://server:8080;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Auth endpoints (tighter rate limit) ───────────────────
        location ~ ^/api/auth/ {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass         http://server:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── General API ───────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://server:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Body size limit (mirrors Go MaxBytesReader)
            client_max_body_size 1m;
        }
    }
}
